<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тулбар с модальным окном</title>
    <!-- Подключение Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body class="bg-light p-4">

    <div class="container">
        <!-- Панель инструментов (Toolbar) -->
        <div class="btn-toolbar justify-content-between bg-white p-3 border rounded shadow-sm" role="toolbar" aria-label="Toolbar с кнопками">
            <div class="btn-group" role="group" aria-label="Основные действия">
                <button type="button" class="btn btn-outline-secondary">Главная</button>
                <button type="button" class="btn btn-outline-secondary">Отчеты</button>
            </div>
            
            <!-- Кнопка вызова параметров -->
            <div class="input-group">
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#settingsModal">
                    ⚙️ Настройки параметров
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно (Modal) -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="settingsModalLabel">Ввод параметров</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <!-- Форма внутри модального окна -->
                    <form id="parametersForm">
                        <div class="mb-3">
                            <label for="paramName" class="form-label">Имя профиля</label>
                            <input type="text" class="form-control" id="paramName" placeholder="Введите название">
                        </div>
                        <div class="mb-3">
                            <label for="paramLimit" class="form-label">Лимит значений</label>
                            <input type="number" class="form-control" id="paramLimit" placeholder="100">
                        </div>
                        <div class="mb-3">
                            <label for="paramType" class="form-label">Тип фильтрации</label>
                            <select class="form-select" id="paramType">
                                <option selected>Выберите тип...</option>
                                <option value="1">Строгий</option>
                                <option value="2">Мягкий</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" form="parametersForm" class="btn btn-success">Применить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключение Bootstrap 5 JS Bundle (включает Popper) -->
    
</body>
</html>
