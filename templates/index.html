<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница с шапкой и футером</title>
    <!-- Подключение Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="bg-dark text-white py-1 mb-4 shadow-sm">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            
            <!-- Блок Логотипа и Слогана -->
            <div class="d-flex align-items-center gap-3">
                <!-- Временная иконка вместо логотипа (замените на свой <img> при необходимости) -->
                <div class="text-white rounded-3 d-flex align-items-center justify-content-center">
                    <!--i class="bi bi-lightning-charge-fill fs-4"></i-->
                    <img src="/static/logo_black.png" style="width: 40px;">
                </div>
                <div>
                    <h1 class="h4 m-0 fw-bold tracking-wide">БиПро</h1>
                    <small class="text-white-50 d-block">Управление и Автоматизация ЖКХ</small>
                </div>
            </div>
            
            <!-- Блок Авторизации (Вход и Регистрация) -->
            <div class="d-flex align-items-center gap-3">
                <!-- Ссылка на регистрацию -->
                <a href="#" class="text-white text-decoration-none opacity-75 opacity-100-hover small">
                    <i class="bi bi-person-plus me-1"></i>Регистрация
                </a>
                
                <!-- Вертикальный разделитель -->
                <span class="text-white-50">|</span>

                <!-- Кнопка Входа с контрастной иконкой -->
                <a href="#" class="btn btn-outline-light d-inline-flex align-items-center gap-2 btn-sm px-3">
                    <i class="bi bi-box-arrow-in-right text-white"></i> 
                    <span>Войти</span>
                </a>
            </div>

        </div>
    </header>

<!-- Основной контент страницы -->
<main class="container my-auto py-3">
    <div class="row justify-content-center">
        <div class="col-10 col-sm-8 col-md-6 col-lg-4">
            
            <!-- Карточка формы авторизации -->
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    
                    <!-- Заголовок формы с иконкой защиты -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold h4 m-0">Вход в систему</h2>
                        <p class="text-muted small mt-1">Введите ваши данные для доступа</p>
                    </div>

                    <!-- Сама форма -->
                    <form action="#" method="POST">
                        
                        <!-- Поле Email (с плавающей подсказкой) -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control rounded-3" id="floatingInput" placeholder="name@example.com" required>
                            <label for="floatingInput" class="text-muted">
                                <i class="bi bi-envelope me-1"></i> Логин
                            </label>
                        </div>

                        <!-- Поле Пароля (с плавающей подсказкой) -->
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control rounded-3" id="floatingPassword" placeholder="Password" required>
                            <label for="floatingPassword" class="text-muted">
                                <i class="bi bi-key me-1"></i> Пароль
                            </label>
                        </div>

                        <!-- Блок "Запомнить меня" и "Забыли пароль?" -->
                        <div class="d-flex justify-content-between align-items-center mb-4 small">
                            <div class="form-check">
                                <input class="form-check-type form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe">
                                    Запомнить меня
                                </label>
                            </div>
                            <a href="#" class="text-decoration-none">Забыли пароль?</a>
                        </div>

                        <!-- Кнопка отправки формы -->
                        <button class="w-100 btn btn-primary btn-lg rounded-3 d-flex align-items-center justify-content-center gap-2 mb-3" type="submit">
                            <i class="bi bi-box-arrow-in-right"></i>
                            <span>Войти</span>
                        </button>

                        <!-- Ссылка на регистрацию для мобильных/альтернативная -->
                        <div class="text-center mt-3 small">
                            <span class="text-muted">Ещё нет аккаунта?</span>
                            <a href="#" class="text-decoration-none ms-1 fw-medium">Создать профиль</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>
    <!-- Подвал сайта (Footer) -->
    <footer class="bg-dark text-white py-1 mt-auto">
        <div class="container">
            <p class="m-0">&copy; 2026 ООО "БиПро". Все права защищены.</p>
        </div>
    </footer>

    <!-- Подключение Bootstrap 5 JS (необязательно, но полезно) -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
